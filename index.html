<!doctype html>
<html lang="en">
  <head>
    <script>
      /* aplica o tema salvo antes de desenhar a tela (evita piscar branco) */
      (function () {
        try {
          var m = localStorage.getItem('sh-theme') || 'auto', h = new Date().getHours();
          var dark = m === 'escuro' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) || (m === 'noturno' && (h >= 18 || h < 6));
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Sh - SSO & Launcher</title>
    
    <!-- PWA Configs -->
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Portal Sh" />
    <link rel="apple-touch-icon" href="/icon.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
